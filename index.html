<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click &amp; Find — GUI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #e8e8e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  h1 {
    font-size: 22px;
    color: #333;
    margin-bottom: 16px;
  }

  /* ---------- Main challenge box ---------- */
  .challenge {
    background: #fff;
    border: 2px solid #222;
    width: 460px;
    max-width: 94vw;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
    position: relative;
    overflow: hidden;
  }

  /* "Click" + target letter area (image-1 style) */
  .click-area {
    text-align: center;
    padding: 14px 10px 10px;
    border-bottom: 2px solid #222;
  }
  .click-word {
    color: #e53935;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .target-letter {
    font-size: 64px;
    font-weight: bold;
    color: #7b6cff;
    line-height: 1.1;
    min-height: 74px;
  }

  /* 3 boxes area (image-2 style) */
  .boxes {
    display: flex;
    background: #f2f2f2;
  }
  .box {
    flex: 1;
    height: 150px;
    border-right: 2px solid #222;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .box:last-child { border-right: none; }
  .box canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .box .box-label {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 11px;
    color: #999;
    font-weight: bold;
    z-index: 2;
  }
  .box.found {
    background: #d8f5d0;
    outline: 4px solid #2e9e44;
    outline-offset: -4px;
  }
  .box.wrong {
    background: #fbdcdc;
    outline: 4px solid #d32f2f;
    outline-offset: -4px;
  }

  /* Go area (image-3 style) */
  .go-area {
    background: #fffbe6;
    text-align: center;
    padding: 14px 10px;
    border-top: 2px solid #222;
  }
  #goBtn {
    background: #fffbe6;
    border: none;
    color: #00008b;
    font-size: 44px;
    font-weight: bold;
    cursor: pointer;
    padding: 4px 40px;
    font-family: Arial, Helvetica, sans-serif;
  }
  #goBtn:hover { background: #fff3b0; }
  #goBtn:active { transform: scale(.96); }
  #goBtn:disabled { opacity: .45; cursor: not-allowed; }

  /* Fake cursor that moves & clicks */
  #cursor {
    position: absolute;
    width: 26px;
    height: 26px;
    pointer-events: none;
    z-index: 10;
    display: none;
    transition: left .7s ease, top .7s ease;
  }
  #cursor svg { width: 100%; height: 100%; filter: drop-shadow(1px 2px 2px rgba(0,0,0,.4)); }
  #cursor.clicking svg { transform: scale(.8); }

  /* Status + controls */
  .status {
    margin-top: 14px;
    font-size: 17px;
    font-weight: bold;
    min-height: 24px;
    color: #333;
    text-align: center;
  }
  .status.ok  { color: #2e7d32; }
  .status.bad { color: #c62828; }

  .controls { margin-top: 10px; display: flex; gap: 12px; }
  .controls button {
    font-size: 15px;
    font-weight: bold;
    padding: 9px 22px;
    border: 2px solid #222;
    background: #fff;
    cursor: pointer;
    border-radius: 6px;
  }
  .controls button:hover { background: #eee; }

  .score {
    margin-top: 12px;
    font-size: 15px;
    color: #555;
  }
  .score b { color: #222; }
</style>
</head>
<body>

<h1>🔍 Click &amp; Find GUI</h1>

<div class="challenge" id="challenge">
  <!-- Click + target letter -->
  <div class="click-area">
    <div class="click-word">Click</div>
    <div class="target-letter" id="targetLetter">?</div>
  </div>

  <!-- 3 boxes -->
  <div class="boxes" id="boxes">
    <div class="box" data-idx="0"><span class="box-label">BOX 1</span><canvas></canvas></div>
    <div class="box" data-idx="1"><span class="box-label">BOX 2</span><canvas></canvas></div>
    <div class="box" data-idx="2"><span class="box-label">BOX 3</span><canvas></canvas></div>
  </div>

  <!-- Go button -->
  <div class="go-area">
    <button id="goBtn">Go</button>
  </div>

  <!-- Animated fake cursor -->
  <div id="cursor">
    <svg viewBox="0 0 24 24"><path d="M4 2 L20 12 L12 13 L16 21 L13 22 L9 14 L4 18 Z" fill="#111" stroke="#fff" stroke-width="1.5"/></svg>
  </div>
</div>

<div class="status" id="status">Target letter ko 3 boxes me find karo, phir <b>Go</b> dabao!</div>

<div class="controls">
  <button id="newRoundBtn">🔄 New Round</button>
  <button id="autoBtn">🤖 Auto Find</button>
</div>

<div class="score">Score: <b id="score">0</b> &nbsp;|&nbsp; Rounds: <b id="rounds">0</b></div>

<script>
  // ---------- Shape definitions (image-2 style) ----------
  // Each shape: { type: 'letter'|'triangle'|'zigzag'|'dot'|'line', char?, color }
  const LETTERS = ['a','q','S','Z','b','d','e','g','o','p','s','x','k','m'];
  const COLORS  = ['#111111','#7b6cff','#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00897b'];

  const boxEls   = [...document.querySelectorAll('.box')];
  const targetEl = document.getElementById('targetLetter');
  const statusEl = document.getElementById('status');
  const goBtn    = document.getElementById('goBtn');
  const cursorEl = document.getElementById('cursor');
  const challengeEl = document.getElementById('challenge');

  let targetLetter = 'q';
  let boxShapes = [];        // shapes per box
  let correctBox = -1;
  let score = 0, rounds = 0;
  let roundDone = false;

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function randomShape(excludeChar) {
    const r = Math.random();
    if (r < 0.55) {
      let ch;
      do { ch = rand(LETTERS); } while (ch === excludeChar);
      return { type: 'letter', char: ch, color: rand(COLORS) };
    } else if (r < 0.70) {
      return { type: 'triangle', color: rand(COLORS) };
    } else if (r < 0.82) {
      return { type: 'zigzag', color: rand(COLORS) };
    } else if (r < 0.91) {
      return { type: 'dot', color: rand(COLORS) };
    }
    return { type: 'line', color: rand(COLORS) };
  }

  // ---------- Draw shapes on canvas (CAPTCHA look) ----------
  function drawShape(canvas, shape) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 140, h = canvas.clientHeight || 150;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // grid background like image-2
    ctx.strokeStyle = '#d9d9d9';
    ctx.lineWidth = 1;
    for (let x = 0; x <= w; x += 10) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y <= h; y += 10) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    const cx = w / 2, cy = h / 2;
    ctx.strokeStyle = shape.color;
    ctx.fillStyle = shape.color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (shape.type === 'letter') {
      ctx.font = 'bold 64px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(shape.char, cx, cy + 4);
    } else if (shape.type === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - 34);
      ctx.lineTo(cx - 32, cy + 26);
      ctx.lineTo(cx + 32, cy + 26);
      ctx.closePath();
      ctx.stroke();
    } else if (shape.type === 'zigzag') {
      ctx.beginPath();
      ctx.moveTo(cx - 38, cy - 26);
      ctx.lineTo(cx - 12, cy + 6);
      ctx.lineTo(cx + 12, cy - 26);
      ctx.lineTo(cx + 38, cy + 6);
      ctx.lineTo(cx + 12, cy + 30);
      ctx.lineTo(cx - 12, cy + 0);
      ctx.lineTo(cx - 38, cy + 30);
      ctx.stroke();
    } else if (shape.type === 'dot') {
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.fill();
    } else if (shape.type === 'line') {
      ctx.beginPath();
      ctx.moveTo(cx - 40, cy + 24);
      ctx.lineTo(cx + 40, cy - 24);
      ctx.stroke();
    }
  }

  // ---------- New round ----------
  function newRound() {
    roundDone = false;
    goBtn.disabled = false;
    cursorEl.style.display = 'none';
    statusEl.className = 'status';
    statusEl.innerHTML = 'Target letter ko 3 boxes me find karo, phir <b>Go</b> dabao!';

    targetLetter = rand(LETTERS);
    targetEl.textContent = targetLetter;
    targetEl.style.color = rand(COLORS);

    correctBox = Math.floor(Math.random() * 3);
    boxShapes = [];
    boxEls.forEach((box, i) => {
      box.classList.remove('found', 'wrong');
      // correct box gets the target letter, others get random shapes
      const shape = (i === correctBox)
        ? { type: 'letter', char: targetLetter, color: targetEl.style.color }
        : randomShape(targetLetter);
      boxShapes.push(shape);
      drawShape(box.querySelector('canvas'), shape);
    });
  }

  // ---------- Find + click animation ----------
  function moveCursorTo(box) {
    return new Promise(resolve => {
      const cRect = challengeEl.getBoundingClientRect();
      const bRect = box.getBoundingClientRect();
      cursorEl.style.display = 'block';
      cursorEl.style.left = '10px';
      cursorEl.style.top = '10px';
      // force reflow so transition animates
      void cursorEl.offsetWidth;
      cursorEl.style.left = (bRect.left - cRect.left + bRect.width / 2 - 4) + 'px';
      cursorEl.style.top  = (bRect.top  - cRect.top  + bRect.height / 2 - 4) + 'px';
      setTimeout(() => {
        cursorEl.classList.add('clicking');
        setTimeout(() => { cursorEl.classList.remove('clicking'); resolve(); }, 220);
      }, 750);
    });
  }

  async function findAndClick() {
    if (roundDone) return;
    roundDone = true;
    goBtn.disabled = true;
    rounds++;
    document.getElementById('rounds').textContent = rounds;

    statusEl.className = 'status';
    statusEl.textContent = '🔍 Searching "' + targetLetter + '" in 3 boxes...';

    // scan boxes one by one
    for (let i = 0; i < 3; i++) {
      await moveCursorTo(boxEls[i]);
      await new Promise(r => setTimeout(r, 250));
      if (i === correctBox) {
        boxEls[i].classList.add('found');
        score++;
        document.getElementById('score').textContent = score;
        statusEl.className = 'status ok';
        statusEl.textContent = '✅ Found! "' + targetLetter + '" Box ' + (i + 1) + ' me tha — click ho gaya!';
        return;
      } else {
        boxEls[i].classList.add('wrong');
      }
    }
  }

  // ---------- Events ----------
  goBtn.addEventListener('click', findAndClick);
  document.getElementById('newRoundBtn').addEventListener('click', newRound);
  document.getElementById('autoBtn').addEventListener('click', async () => {
    if (roundDone) { newRound(); }
    await new Promise(r => setTimeout(r, 400));
    findAndClick();
  });

  // Manual box click (user can also click a box directly)
  boxEls.forEach((box, i) => {
    box.addEventListener('click', () => {
      if (roundDone) return;
      roundDone = true;
      goBtn.disabled = true;
      rounds++;
      document.getElementById('rounds').textContent = rounds;
      if (i === correctBox) {
        box.classList.add('found');
        score++;
        document.getElementById('score').textContent = score;
        statusEl.className = 'status ok';
        statusEl.textContent = '✅ Sahi! "' + targetLetter + '" yahi tha!';
      } else {
        box.classList.add('wrong');
        boxEls[correctBox].classList.add('found');
        statusEl.className = 'status bad';
        statusEl.textContent = '❌ Galat box! "' + targetLetter + '" Box ' + (correctBox + 1) + ' me tha.';
      }
    });
  });

  // ---------- Start ----------
  newRound();
  window.addEventListener('resize', () => {
    boxEls.forEach((box, i) => drawShape(box.querySelector('canvas'), boxShapes[i]));
  });
</script>
</body>
</html>
